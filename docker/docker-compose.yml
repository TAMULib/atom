version: '3.2'

volumes:
  elasticsearch_data:
  percona_data:

services:

  atom:
    build: ..
    env_file: etc/environment
    volumes:
      - ..:/atom/src:rw

  atom_worker:
    build: ..
    command: worker
    env_file: etc/environment
    depends_on:
      - gearmand
      - percona
    restart: on-failure:5
    volumes:
      - ..:/atom/src:rw

  nginx:
    image: nginx:latest
    volumes:
      - ..:/atom/src:ro
      - ./etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8301:80"

  elasticsearch:
    image: harbor.library.tamu.edu/apache-php/elasticsearch:5.6.16-fix-2
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    volumes:
      - D:/docker_files/atom/elasticsearch:/usr/share/elasticsearch/data
    environment:
      - 'bootstrap.memory_lock=true'      
      - 'xpack.security.enabled=false'
      - 'cluster.routing.allocation.disk.threshold_enabled=false'
      - 'ES_JAVA_OPTS=-Xms640m -Xmx640m'   
      - 'discovery.type=single-node'
    ports:
      - "127.0.0.1:8302:9200"

  percona:
    image: percona:5.7
    env_file: etc/environment
    volumes:
      - D:/docker_files/atom/atom/percona:/var/lib/mysql:rw
      - ./etc/mysql/mysqld.cnf:/etc/my.cnf.d/mysqld.cnf:ro
    ports:
      - "127.0.0.1:8303:3306"

  memcached:
    image: memcached
    command: -p 11211 -m 128 -u memcache
    ports:
      - "127.0.0.1:8304:11211"

  gearmand:
    image: artefactual/gearmand
    ports:
      - "127.0.0.1:8305:4730"
